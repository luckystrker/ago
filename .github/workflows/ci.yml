name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framework:
    name: Framework (ago/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" $unformatted
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

  examples:
    name: Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Smoke (run three examples end-to-end)
        run: |
          go run ./ask          > /dev/null
          go run ./tools        > /dev/null
          go run ./structured_output > /dev/null
