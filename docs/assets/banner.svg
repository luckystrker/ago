<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="AGo — AG2, ported to Go">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#101d33"/>
      <stop offset="1" stop-color="#173252"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#00add8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00add8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="240" rx="18" fill="url(#bg)"/>
  <rect width="960" height="240" rx="18" fill="url(#glow)"/>

  <!-- event-stream motif: events flowing into an agent node -->
  <g stroke="#33415c" stroke-width="2" fill="none">
    <path d="M 600 62 C 660 62 660 108 718 108"/>
    <path d="M 600 120 L 718 120"/>
    <path d="M 600 178 C 660 178 660 132 718 120"/>
    <path d="M 800 120 L 858 120"/>
  </g>
  <g fill="#22314a" stroke="#3d5578" stroke-width="2">
    <circle cx="582" cy="62" r="13"/>
    <circle cx="582" cy="120" r="13"/>
    <circle cx="582" cy="178" r="13"/>
  </g>
  <circle cx="760" cy="120" r="34" fill="#0e2a44" stroke="url(#accent)" stroke-width="3"/>
  <text x="760" y="131" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#7ee787">A</text>
  <g fill="#7ee787">
    <circle cx="872" cy="120" r="8"/>
  </g>
  <text x="872" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa3bf">reply</text>
  <text x="582" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5a6f8f">events</text>

  <!-- wordmark -->
  <text x="76" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff">AGo</text>
  <text x="82" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#9fb3d1">AG2, ported to Go</text>
  <rect x="82" y="178" width="132" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
